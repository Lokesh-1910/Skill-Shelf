{% load static %}

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">
      <img src="{% static 'Images/Logo.jpeg' %}" alt="Skill Shelf Logo" />
      <h2>Skill Shelf</h2>
    </div>
    <div class="nav-links">
      <a href="/dashboard/"><i class="fas fa-home"></i> Dashboard</a>
      <a href="/documents/"><i class="fas fa-folder"></i> Documents</a>
      <a href="/upload/"><i class="fas fa-upload"></i> Upload</a>
      <a href="/profile/"><i class="fas fa-user"></i> Profile</a>
      <a
        href="/logout/"
        class="logout-link"
        onclick="return confirm('Are you sure you want to logout?');"
      >
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </div>
</nav>

<!-- Inactivity Warning Modal (No Stay Button) -->
<div id="inactivityWarning" class="inactivity-modal" style="display: none;">
    <div class="inactivity-content">
        <i class="fas fa-clock"></i>
        <h3>Session Timeout</h3>
        <p>Your session will expire in <strong id="countdown">30</strong> seconds due to inactivity.</p>
        <p>You will be logged out automatically.</p>
    </div>
</div>

<link rel="stylesheet" href="{% static 'CSS/base.css' %}">
<script src="{% static 'JS/base.js' %}"></script>
