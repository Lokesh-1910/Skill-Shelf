{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Shelf – All Documents</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'CSS/base.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/Document.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>

    {% include 'partials/header.html' %}

    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h4>Document Categories</h4>
            <div id="categories"></div>

            <h4 style="margin-top:28px;">Filters</h4>

            <div class="filter">
                <select id="dateFilter">
                    <option value="all">📅 Date Uploaded</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                </select>
            </div>

            <div class="filter">
                <select id="tagFilter">
                    <option value="all">🏷 All Tags</option>
                    <option value="important">Important</option>
                    <option value="official">Official</option>
                    <option value="personal">Personal</option>
                </select>
            </div>

            <div class="filter">
                <select id="sizeFilter">
                    <option value="all">📁 File Size</option>
                    <option value="small">Small (< 1MB)</option>
                    <option value="medium">Medium (1-2MB)</option>
                    <option value="large">Large (> 2MB)</option>
                </select>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="main-header">
                <div>
                    <h2>All Documents</h2>
                    <div class="document-count" id="docCount">6 documents found</div>
                </div>
            </div>

            <div class="controls">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input id="search" placeholder="Search documents by name, category, or tag...">
                </div>
                <select id="sort">
                    <option value="desc">📅 Newest First</option>
                    <option value="asc">📅 Oldest First</option>
                    <option value="name">A → Z</option>
                    <option value="size">Size ↓</option>
                </select>
            </div>

            <div id="documents"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal" id="documentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <i class="fas fa-file-alt"></i>
                    Document Viewer
                </h3>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="document-viewer">
                <!-- Sidebar with document info -->
                <div class="document-sidebar">
                    <div class="info-section">
                        <h4>Document Information</h4>
                        <div class="info-grid" id="modalInfoGrid"></div>
                    </div>

                    <div class="info-section">
                        <h4>Description</h4>
                        <div id="modalDescription" class="info-item"></div>
                    </div>

                    <div class="info-section">
                        <h4>Quick Actions</h4>
                        <div class="action-buttons">
                            <button class="btn btn-success" id="downloadBtn">
                                <i class="fas fa-download"></i> Download
                            </button>
                            <button class="btn btn-secondary" id="printBtn">
                                <i class="fas fa-print"></i> Print
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main preview area -->
                <div class="document-main">
                    <div class="preview-modes">
                        <button class="mode-btn active" data-mode="fit">
                            <i class="fas fa-expand-alt"></i> Fit to Screen
                        </button>
                        <button class="mode-btn" data-mode="original">
                            <i class="fas fa-search"></i> Original Size
                        </button>
                        <button class="mode-btn" data-mode="fullscreen">
                            <i class="fas fa-expand"></i> Full Screen
                        </button>
                    </div>

                    <div class="preview-container">
                        <img id="modalImage" src="" alt="Document Preview" class="preview-image">

                        <div class="zoom-controls">
                            <button id="zoomOut">
                                <i class="fas fa-search-minus"></i>
                            </button>
                            <button id="zoomReset">
                                <i class="fas fa-redo"></i>
                            </button>
                            <button id="zoomIn">
                                <i class="fas fa-search-plus"></i>
                            </button>
                            <button id="rotateBtn">
                                <i class="fas fa-redo-alt"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Thumbnail strip for document pages -->
                    <div class="thumbnail-strip" id="thumbnailStrip"></div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" id="shareBtn">
                            <i class="fas fa-share-alt"></i> Share Document
                        </button>
                        <button class="btn btn-success" id="saveCopyBtn">
                            <i class="fas fa-copy"></i> Save Copy
                        </button>
                        <button class="btn btn-secondary" id="closeModal2">
                            <i class="fas fa-times"></i> Close Viewer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% include 'partials/footer.html' %}

    <script src="{% static 'JS/Document.js' %}"></script>
</body>

</html>
